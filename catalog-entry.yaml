name: MLflow End-to-End MLOps

entries:
  - title: MLflow End-to-End MLOps
    label: mlflow_logistics
    short_description: |
      Experiment tracking for scikit-learn classifiers with MLflow, CML Model serving, and a Streamlit demo app.
    long_description: |
      This AMP demonstrates end-to-end MLOps using MLflow inside Cloudera Machine Learning (CML).
      Two scikit-learn classifiers — a k-nearest neighbors model and a random forest — are trained on a
      synthetic classification dataset and instrumented with MLflow to log hyperparameters, accuracy metrics,
      and serialized model artifacts.

      After training, any logged run can be deployed as a live REST endpoint using CML Models. A Streamlit
      application is included to query the deployed endpoint interactively: drop in your model's predict URL
      and access key as environment variables and start sending predictions from the browser.

      Key capabilities demonstrated:
      - MLflow experiment tracking (parameters, metrics, and model artifacts)
      - MLflow UI hosted as a CML Application
      - CML Model serving with a Python 3.13 scikit-learn pipeline
      - Streamlit demo app pre-wired to the CML Model via environment variables

