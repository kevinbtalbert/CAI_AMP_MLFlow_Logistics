name: MLFlow End to End MLOps
description: Instrumenting some scikit-learn models with MLFLow for experiment tracking.
author: Cloudera Inc.
specification_version: 1.0
prototype_version: 2.0
date: "2022-03-28"

environment_variables:
  PYTHONPATH:
    default: "/home/cdsw"
    description: "Allow Python to find scripts directory when run as CLI"
    prompt_user: false
  MLFLOW_TRACKING_URI:
    default: ""
    description: "URI of the tracking server. Leave blank to run locally."
    prompt_user: false
  MLFLOW_RUN_ID:
    default: ""
    description: "MLflow run ID to load for the CML Model endpoint. Leave blank to use the most-recent run."
    prompt_user: false
  MLFLOW_SERVER_ALLOWED_HOSTS:
    default: "*"
    description: "Comma-separated list of allowed Host headers for the MLflow server. * is an acceptable wildcard."
    prompt_user: false
  CML_MODEL_PREDICT_URL:
    default: "tbd"
    description: "Full predict URL of the deployed CML Model (used by the Streamlit demo app)."
    prompt_user: false
  CML_MODEL_ACCESS_KEY:
    default: "tbd"
    description: "Access key for the deployed CML Model (used by the Streamlit demo app)."
    prompt_user: false

runtimes:
  - editor: JupyterLab
    kernel: Python 3.13
    edition: Standard

tasks:
  - type: create_job
    name: Install Dependencies
    entity_label: install_dependencies
    script: cml/install_dependencies.py
    arguments: None
    cpu: 2
    memory: 8
    short_summary: Create a job to install project dependencies.
    environment:
      TASK_TYPE: CREATE/RUN_JOB
    
  - type: run_job
    entity_label: install_dependencies
    short_summary: Run the install dependencies job.
    long_summary: Run the install dependencies job.

  - type: create_job
    name: Train KNeighbors
    entity_label: train_kneighbors
    script: scripts/train_kneighbors.py
    arguments: None
    cpu: 1
    memory: 2
    short_summary: Create a training job for a k-nearest neighbors classifier.
    environment:
      TASK_TYPE: CREATE/RUN_JOB
    
  - type: run_job
    entity_label: train_kneighbors
    short_summary: Training a knn algorithm.
    long_summary: Train a k-nearest neighbors algorithm for classification on a fake dataset.
    
  - type: create_job
    name: Train Random Forest
    entity_label: train_random_forest
    script: scripts/train_random_forest.py
    arguments: None
    cpu: 1
    memory: 2
    short_summary: Create a training job for a random forest classifier.
    environment:
      TASK_TYPE: CREATE/RUN_JOB
    
  - type: run_job
    entity_label: train_random_forest
    short_summary: Train a random forest algorithm.
    long_summary: Training a random forest algorithm for classification on a fake dataset.
    
  - type: start_application
    name: MLFlow UI
    subdomain: mlflow
    script: cml/mlflow_ui.py
    short_summary: Launch the MLFlow UI application
    cpu: 1
    memory: 4
    environment_variables:
      TASK_TYPE: START_APPLICATION

  - type: start_application
    name: Classifier Demo
    subdomain: classifier-demo
    script: cml/app.py
    short_summary: Streamlit app to query the deployed CML Model endpoint
    long_summary: >
      Interactive demo that sends a 20-feature vector to a trained scikit-learn
      classifier served as a CML Model. Set CML_MODEL_PREDICT_URL and
      CML_MODEL_ACCESS_KEY on this application to connect it to a deployed model.
    environment_variables:
      TASK_TYPE: START_APPLICATION
